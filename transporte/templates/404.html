<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada | Error 404</title>
    <!-- Importamos Bootstrap desde internet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación (Consistente con bienvenida) -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Sistema de Transporte</span>
        </div>
    </nav>

    <!-- Contenedor principal de error -->
    <div class="container mt-5">
        <div class="p-5 text-center bg-white rounded-4 shadow-sm border">
            
            <!-- Icono y Error -->
            <div class="text-secondary mb-4">
                <h1 class="display-1 fw-bold">404</h1>
                <h2 class="h4 text-uppercase fw-semibold tracking-wide">Página no encontrada</h2>
            </div>
            
            <h1 class="h3 text-primary mb-3">GESTIÓN DE TRANSPORTE</h1>
            
            <hr class="my-4">
            
            <p class="lead text-secondary mx-auto" style="max-width: 600px;">
                Lo sentimos, la ruta o recurso que buscas no existe en este sistema o fue movido definitivamente.
            </p>
            
            <div class="mt-4">
                <!-- Botón para volver al inicio -->
                <a href="/" class="btn btn-primary btn-lg px-4 shadow-sm">Volver al Inicio</a>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
